    #
    # Control plane file patches
    #
    - name: controlPlaneFiles
      description: "Populate base kubeadmConfigSpec.files entries for control plane nodes and optionally add registry mirrors."
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
          - op: add
            path: "/spec/template/spec/kubeadmConfigSpec/files"
            valueFrom:
              template: |
                - content: |
                    [Service]
                    LimitNOFILE=131072:524288
                  owner: root:root
                  path: /etc/systemd/system/containerd.service.d/10-nofile.conf
                  permissions: "0644"
                {{ `{{- if .auditLogging }}` }}
                - content: |
                    apiVersion: audit.k8s.io/v1
                    kind: Policy
                    rules:
                      - level: None
                        nonResourceURLs:
                          - /healthz*
                          - /logs
                          - /metrics
                          - /swagger*
                          - /livez*
                          - /readyz*
                          - /version
                      - level: Metadata
                        omitStages:
                          - RequestReceived
                        resources:
                          - group: authentication.k8s.io
                            resources:
                              - tokenreviews
                      - level: RequestResponse
                        omitStages:
                          - RequestReceived
                        resources:
                          - group: authorization.k8s.io
                            resources:
                              - subjectaccessreviews
                      - level: RequestResponse
                        omitStages:
                          - RequestReceived
                        verbs:
                          - create
                          - patch
                          - update
                          - delete
                        resources:
                          - group: ""
                            resources:
                              - pods
                      - level: Metadata
                        omitStages:
                          - RequestReceived
                  owner: root:root
                  path: /etc/kubernetes/audit-policy.yaml
                  permissions: "0644"
                {{ `{{- end }}` }}
                {{ `{{- range $r := .registryMirrors }}` }}
                - content: |
                    server = "{{ `{{ $r.urlUpstream }}` }}"
                    [host."{{ `{{ $r.urlMirror }}` }}"]
                      capabilities = ["pull","resolve"]
                      override_path = true
                    {{ `{{- if $r.certMirror }}` }}
                      ca = "ca.crt"
                    {{ `{{- end }}` }}
                  owner: root:root
                  path: /etc/containerd/certs.d/{{ `{{ $r.hostnameUpstream }}` }}/hosts.toml
                  permissions: "0644"
                - content: |
                    [[registry]]
                    prefix = "{{ `{{ $r.hostnameUpstream }}` }}"
                    location = "{{ `{{ $r.hostnameUpstream }}` }}"
                    [[registry.mirror]]
                    location = "{{ `{{ $r.urlMirror }}` }}"
                  owner: root:root
                  path: /etc/containers/registries.conf.d/50-mirror-{{ `{{ $r.hostnameUpstream }}` }}.conf
                  permissions: "0644"
                {{ `{{- if $r.certMirror }}` }}
                - content: "{{ `{{ $r.certMirror }}` }}"
                  owner: root:root
                  path: /etc/containerd/certs.d/{{ `{{ $r.hostnameUpstream }}` }}/ca.crt
                  permissions: "0644"
                - content: "{{ `{{ $r.certMirror }}` }}"
                  owner: root:root
                  path: /etc/containers/certs.d/{{ `{{ $r.hostnameUpstream }}` }}/ca.crt
                  permissions: "0644"
                {{ `{{- end }}` }}
                {{ `{{- end }}` }}
