apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Version }}-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer: {}
          controllerManager:
            extraArgs:
              cloud-provider: external
              bind-address: 0.0.0.0
              secure-port: "10257"
          scheduler:
            extraArgs:
              bind-address: 0.0.0.0
              secure-port: "10259"
          etcd:
            local:
              dataDir: /var/lib/etcd
              extraArgs:
                listen-metrics-urls: http://0.0.0.0:2381
                auto-compaction-mode: periodic
                auto-compaction-retention: 8h
                election-timeout: "2500"
                heartbeat-interval: "250"
                snapshot-count: "6400"
        files:
        - content: |
            ---
            apiVersion: kubeproxy.config.k8s.io/v1alpha1
            kind: KubeProxyConfiguration
            metricsBindAddress: "0.0.0.0:10249"
          path: /etc/kube-proxy-config.yaml
        - content: |
            #!/usr/bin/env bash

            #
            # (PK) I couldn't find a better/simpler way to conifgure it. See:
            # https://github.com/kubernetes-sigs/cluster-api/issues/4512
            #

            set -o errexit
            set -o nounset
            set -o pipefail

            dir=$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )
            readonly dir

            # Exit fast if already appended.
            if [[ ! -f ${dir}/kube-proxy-config.yaml ]]; then
              exit 0
            fi

            # kubeadm config is in different directory in Flatcar (/etc) and Ubuntu (/run/kubeadm).
            kubeadm_file="/etc/kubeadm.yml"
            if [[ ! -f ${kubeadm_file} ]]; then
              kubeadm_file="/run/kubeadm/kubeadm.yaml"
            fi
            
            # Run this script only if this is the init node.
            if [[ ! -f ${kubeadm_file} ]]; then
              exit 0
            fi

            # Append kube-proxy-config.yaml to kubeadm config and delete it
            cat "${dir}/kube-proxy-config.yaml" >> "${kubeadm_file}"
            rm "${dir}/kube-proxy-config.yaml"

            echo success > /tmp/kube-proxy-patch
          owner: root:root
          path: /etc/kube-proxy-patch.sh
          permissions: "0755"
        - content: |
            #!/usr/bin/env bash
            # The full kubeadm join command is embedded in this same cloud-init script,
            # a few lines below. Extract the VIP from it.
            VIPPORT=$(grep -h '^ *apiServerEndpoint:' /var/lib/cloud/instance/user-data.txt /run/cloud-init/user-data.txt 2>/dev/null | head -1 | sed 's/^ *apiServerEndpoint: *//')
            if test -z "$VIPPORT"; then
              VIPPORT=$(grep -h '^ *controlPlaneEndpoint:' /var/lib/cloud/instance/user-data.txt /run/cloud-init/user-data.txt 2>/dev/null | head -1 | sed 's/^ *controlPlaneEndpoint: *//')
            fi
            echo "VIP Port: $VIPPORT"
            #cat /var/lib/cloud/instance/user-data.txt /run/cloud-init/user-data.txt 2>/dev/null
            if test -z "$VIPPORT"; then echo "No apiServerEndpoint found, cannot wait ..."; sleep 6; exit 0; fi
            for i in $(seq 0 15); do
              if curl -ks --max-time 5 "https://${VIPPORT}/healthz"; then
                echo "[pre-join] API server ${VIPPORT} reachable (attempt $i)"
                break
              fi
              echo "[pre-join] waiting… ($i/30) ${VIPPORT}"
              sleep 4
            done
          owner: root:root
          permissions: "0755"
          path: /etc/kube-wait-kubeapi.sh
        preKubeadmCommands:
        - bash /etc/kube-proxy-patch.sh
        - bash /etc/kube-wait-kubeapi.sh
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              provider-id: 'openstack:///{{ `{{ instance_id }}` }}'
            name: '{{ `{{ local_hostname }}` }}'
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              provider-id: 'openstack:///{{ `{{ instance_id }}` }}'
            name: '{{ `{{ local_hostname }}` }}'
